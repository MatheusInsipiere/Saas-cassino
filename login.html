<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Gestor Bac Bo - Login</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Orbitron:wght@600;700;800;900&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #02030b;
      font-family: "Inter", sans-serif;
      color: #ffffff;
      overflow: hidden;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 50% 12%, rgba(26, 52, 164, 0.34) 0%, transparent 28%),
        radial-gradient(circle at 73% 53%, rgba(219, 0, 54, 0.20) 0%, transparent 30%),
        radial-gradient(circle at 20% 53%, rgba(0, 88, 255, 0.18) 0%, transparent 32%),
        linear-gradient(180deg, #02030a 0%, #050817 53%, #02030a 100%);
    }

    .page::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle, rgba(255, 24, 73, 0.95) 0 1px, transparent 1px),
        radial-gradient(circle, rgba(31, 106, 255, 0.9) 0 1px, transparent 1px);
      background-size: 110px 140px, 130px 120px;
      background-position: 80px 40px, 18px 118px;
      opacity: 0.28;
      pointer-events: none;
    }

    .neon-left {
      position: absolute;
      left: -55px;
      top: 38%;
      width: 160px;
      height: 250px;
      border: 2px solid rgba(45, 107, 255, 0.82);
      border-right: none;
      transform: rotate(45deg);
      filter: drop-shadow(0 0 8px rgba(41, 101, 255, 0.9));
      opacity: 0.82;
    }

    .neon-right {
      position: absolute;
      right: -68px;
      top: 20%;
      width: 165px;
      height: 265px;
      border: 2px solid rgba(255, 25, 63, 0.80);
      border-left: none;
      transform: rotate(45deg);
      filter: drop-shadow(0 0 8px rgba(255, 25, 63, 0.85));
      opacity: 0.84;
    }

    .login-wrapper {
      position: relative;
      z-index: 2;
      width: min(88vw, 390px);
      max-width: 390px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: -8px;
    }

    /* LOGO */
    .brand {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 18px;
      position: relative;
    }

    .dice-area {
      width: 180px;
      height: 92px;
      position: relative;
      margin-bottom: 2px;
      z-index: 2;
    }

    .dice {
      position: absolute;
      width: 56px;
      height: 56px;
      border-radius: 12px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      padding: 9px;
      box-shadow:
        inset 0 0 10px rgba(255,255,255,0.18),
        0 0 16px currentColor;
    }

    .dice span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ffffff;
      align-self: center;
      justify-self: center;
      box-shadow: 0 0 5px rgba(255,255,255,0.9);
    }

    .dice-blue {
      left: 36px;
      top: 0;
      transform: rotate(-16deg);
      color: rgba(35, 96, 255, 0.95);
      background: linear-gradient(145deg, #07124a 0%, #1141ff 100%);
      border: 1px solid rgba(103, 144, 255, 0.85);
    }

    .dice-red {
      right: 34px;
      top: 12px;
      transform: rotate(16deg);
      color: rgba(255, 23, 58, 0.95);
      background: linear-gradient(145deg, #6c0617 0%, #f10a2d 100%);
      border: 1px solid rgba(255, 113, 133, 0.85);
    }

    .dice-blue span:nth-child(1) { grid-column: 1; grid-row: 1; }
    .dice-blue span:nth-child(2) { grid-column: 3; grid-row: 1; }
    .dice-blue span:nth-child(3) { grid-column: 1; grid-row: 2; }
    .dice-blue span:nth-child(4) { grid-column: 3; grid-row: 2; }
    .dice-blue span:nth-child(5) { grid-column: 1; grid-row: 3; }
    .dice-blue span:nth-child(6) { grid-column: 3; grid-row: 3; }

    .dice-red span:nth-child(1) { grid-column: 1; grid-row: 1; }
    .dice-red span:nth-child(2) { grid-column: 3; grid-row: 1; }
    .dice-red span:nth-child(3) { grid-column: 2; grid-row: 2; }
    .dice-red span:nth-child(4) { grid-column: 1; grid-row: 3; }
    .dice-red span:nth-child(5) { grid-column: 3; grid-row: 3; }

    .brand-small {
      font-family: "Orbitron", sans-serif;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 8px;
      color: #eef2ff;
      line-height: 1;
      margin-bottom: 4px;
      z-index: 3;
      position: relative;
      text-shadow: 0 0 8px rgba(255,255,255,0.35);
    }

    .brand-title {
      font-family: "Orbitron", sans-serif;
      font-weight: 900;
      font-size: clamp(44px, 11vw, 60px);
      letter-spacing: -3px;
      line-height: 0.92;
      transform: skew(-8deg);
      z-index: 3;
      position: relative;
      text-shadow:
        0 3px 0 rgba(0,0,0,0.5),
        0 0 12px rgba(255,255,255,0.12);
    }

    .brand-title .bac {
      background: linear-gradient(180deg, #fefefe 0%, #bcc6dd 40%, #525f78 78%, #f0f4ff 100%);
      -webkit-background-clip: text;
      color: transparent;
      -webkit-text-stroke: 1px rgba(255,255,255,0.18);
    }

    .brand-title .bo {
      background: linear-gradient(180deg, #ff4561 0%, #e10628 50%, #750816 100%);
      -webkit-background-clip: text;
      color: transparent;
      -webkit-text-stroke: 1px rgba(255,85,105,0.15);
      margin-left: 2px;
    }

    .brand-subtitle {
      margin-top: 7px;
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: #9da6bc;
      text-transform: uppercase;
      z-index: 3;
      position: relative;
    }

    .brand-subtitle span {
      color: #ff183c;
    }

    /* CARD */
    .login-card {
      width: 100%;
      max-width: 346px;
      padding: 24px 28px 23px;
      border-radius: 16px;
      position: relative;
      background:
        linear-gradient(#080c1c, #080c1c) padding-box,
        linear-gradient(130deg, rgba(38, 97, 255, 0.95), rgba(255, 28, 61, 0.95)) border-box;
      border: 1px solid transparent;
      box-shadow:
        0 0 28px rgba(14, 42, 155, 0.30),
        0 0 28px rgba(192, 9, 41, 0.18),
        inset 0 0 22px rgba(255, 255, 255, 0.025);
      overflow: hidden;
    }

    .login-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 0% 0%, rgba(38, 99, 255, 0.18), transparent 42%),
        radial-gradient(circle at 100% 10%, rgba(255, 22, 57, 0.14), transparent 40%);
      pointer-events: none;
    }

    .card-content {
      position: relative;
      z-index: 1;
    }

    .login-title {
      font-size: 15px;
      text-align: center;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 5px;
    }

    .login-subtitle {
      font-size: 10px;
      color: #8e96aa;
      text-align: center;
      margin-bottom: 23px;
    }

    .form-group {
      margin-bottom: 13px;
    }

    .form-label {
      display: block;
      font-size: 10px;
      font-weight: 600;
      color: #d6d9e6;
      margin-bottom: 7px;
    }

    .input-box {
      height: 38px;
      border-radius: 7px;
      border: 1px solid rgba(72, 82, 119, 0.55);
      background: rgba(13, 18, 36, 0.92);
      display: flex;
      align-items: center;
      padding: 0 12px;
      box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.28);
    }

    .input-box svg {
      width: 14px;
      height: 14px;
      margin-right: 9px;
      opacity: 0.65;
      flex: 0 0 auto;
    }

    .input-box input {
      width: 100%;
      height: 100%;
      border: none;
      outline: none;
      background: transparent;
      color: #ffffff;
      font-size: 11px;
      font-family: "Inter", sans-serif;
    }

    .input-box input::placeholder {
      color: #566077;
    }

    .eye {
      margin-left: 8px;
      opacity: 0.65;
      cursor: pointer;
    }

    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: -2px;
      margin-bottom: 18px;
      font-size: 9.5px;
    }

    .remember {
      display: flex;
      align-items: center;
      color: #8e96aa;
      gap: 6px;
      cursor: pointer;
      user-select: none;
    }

    .remember input {
      width: 11px;
      height: 11px;
      accent-color: #244eff;
    }

    .forgot {
      color: #ff173d;
      text-decoration: none;
      font-weight: 700;
    }

    .login-btn {
      width: 100%;
      height: 40px;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      background: linear-gradient(90deg, #1739ff 0%, #5e20cd 43%, #e20526 100%);
      color: #ffffff;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.4px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      box-shadow:
        0 0 18px rgba(33, 67, 255, 0.42),
        0 0 18px rgba(226, 5, 38, 0.25);
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .login-btn:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    .divider {
      margin: 18px 0 13px;
      display: flex;
      align-items: center;
      gap: 11px;
      color: #8d94aa;
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: rgba(86, 95, 126, 0.42);
    }

    .admin-btn {
      width: 100%;
      height: 36px;
      border-radius: 7px;
      border: 1px solid rgba(92, 105, 145, 0.68);
      background: rgba(8, 13, 30, 0.62);
      color: #b8bfd2;
      font-size: 9.5px;
      font-weight: 800;
      letter-spacing: 0.15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      text-transform: uppercase;
    }

    .admin-btn svg {
      width: 13px;
      height: 13px;
      opacity: 0.78;
    }

    @media (max-width: 420px) {
      .login-wrapper {
        width: 79vw;
        margin-top: -8px;
      }

      .brand {
        margin-bottom: 13px;
      }

      .dice-area {
        width: 160px;
        height: 78px;
        margin-bottom: 0;
      }

      .dice {
        width: 50px;
        height: 50px;
        padding: 8px;
      }

      .dice span {
        width: 6px;
        height: 6px;
      }

      .dice-blue {
        left: 31px;
        top: 0;
      }

      .dice-red {
        right: 30px;
        top: 11px;
      }

      .brand-small {
        font-size: 11px;
        letter-spacing: 7px;
        margin-bottom: 3px;
      }

      .brand-title {
        font-size: 42px;
      }

      .brand-subtitle {
        font-size: 6.5px;
        margin-top: 6px;
      }

      .login-card {
        padding: 21px 22px 20px;
      }

      .login-title {
        font-size: 12px;
      }

      .login-subtitle {
        font-size: 8px;
      }

      .form-label {
        font-size: 8px;
      }

      .input-box {
        height: 32px;
      }

      .input-box input {
        font-size: 9px;
      }

      .options {
        font-size: 7.4px;
      }

      .login-btn {
        height: 34px;
        font-size: 9px;
      }

      .admin-btn {
        height: 31px;
        font-size: 7.5px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="neon-left"></div>
    <div class="neon-right"></div>

    <section class="login-wrapper">

      <header class="brand">
        <div class="dice-area">
          <div class="dice dice-blue">
            <span></span><span></span><span></span>
            <span></span><span></span><span></span>
          </div>

          <div class="dice dice-red">
            <span></span><span></span><span></span>
            <span></span><span></span>
          </div>
        </div>

        <div class="brand-small">GESTOR</div>

        <div class="brand-title">
          <span class="bac">BAC</span><span class="bo">BO</span>
        </div>

        <div class="brand-subtitle">
          DISCIPLINA. <span>ESTRATÉGIA.</span> CONTROLE. RESULTADOS.
        </div>
      </header>

      <form class="login-card" id="loginForm">
        <div class="card-content">
          <h1 class="login-title">Bem-vindo de volta!</h1>
          <p class="login-subtitle">Faça login para acessar sua conta</p>

          <div class="form-group">
            <label class="form-label" for="email">E-mail</label>

            <div class="input-box">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M4 6.5h16v11H4v-11Z" stroke="#9aa3bd" stroke-width="1.7" />
                <path d="m4.8 7.4 7.2 5.4 7.2-5.4" stroke="#9aa3bd" stroke-width="1.7" />
              </svg>

              <input 
                type="email" 
                id="email" 
                placeholder="Digite seu e-mail" 
                autocomplete="email" 
              />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="senha">Senha</label>

            <div class="input-box">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M7 10V8.2C7 5.8 8.9 4 12 4s5 1.8 5 4.2V10" stroke="#9aa3bd" stroke-width="1.7" />
                <path d="M6 10h12v9H6v-9Z" stroke="#9aa3bd" stroke-width="1.7" />
              </svg>

              <input 
                type="password" 
                id="senha" 
                placeholder="Digite sua senha" 
                autocomplete="current-password" 
              />

              <svg class="eye" id="toggleSenha" viewBox="0 0 24 24" fill="none">
                <path d="M3 12s3.2-5 9-5 9 5 9 5-3.2 5-9 5-9-5-9-5Z" stroke="#9aa3bd" stroke-width="1.5" />
                <circle cx="12" cy="12" r="2.4" stroke="#9aa3bd" stroke-width="1.5" />
              </svg>
            </div>
          </div>

          <div class="options">
            <label class="remember">
              <input type="checkbox" id="lembrar" checked />
              <span>Lembrar-me</span>
            </label>

            <a href="#" class="forgot">Esqueci minha senha</a>
          </div>

          <button type="submit" class="login-btn">
            ENTRAR
            <span>→</span>
          </button>

          <div class="divider">OU</div>

          <button type="button" class="admin-btn">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M12 3.5 19 6v5.3c0 4.3-2.8 7.5-7 9.2-4.2-1.7-7-4.9-7-9.2V6l7-2.5Z" stroke="#aeb7cf" stroke-width="1.7" />
              <path d="M9.4 12.1 11.2 14l3.7-4" stroke="#aeb7cf" stroke-width="1.7" />
            </svg>

            ACESSO ADMINISTRATIVO
          </button>
        </div>
      </form>

    </section>
  </main>

  <script>
    const senha = document.getElementById("senha");
    const toggleSenha = document.getElementById("toggleSenha");
    const loginForm = document.getElementById("loginForm");
    const email = document.getElementById("email");
    const lembrar = document.getElementById("lembrar");

    const emailSalvo = localStorage.getItem("gestor_bacbo_email");

    if (emailSalvo) {
      email.value = emailSalvo;
      lembrar.checked = true;
    }

    toggleSenha.addEventListener("click", function () {
      senha.type = senha.type === "password" ? "text" : "password";
    });

    loginForm.addEventListener("submit", function (event) {
      event.preventDefault();

      if (lembrar.checked) {
        localStorage.setItem("gestor_bacbo_email", email.value);
      } else {
        localStorage.removeItem("gestor_bacbo_email");
      }

      alert("Login visual funcionando. Depois conectaremos com banco de dados e autenticação real.");
    });
  </script>
</body>
</html>
